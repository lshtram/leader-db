batch_gates:
  - all identities remain reviewed and locked
  - every dossier validates with all 80 coverage and local-prior provenance rows
  - every dossier has a cited evidence-environment assessment
  - every chapter judgment has a cited bias assessment
  - all evidence, local-prior, decisive, contrary, and bias references resolve
  - local evidence survives package to research briefing to dossier to projection to judge
  - structured prior summaries match packages and never falsely claim unavailability
  - no event-location fact is interpreted as ruler aggression
  - no national corruption fact becomes personal 7B evidence without personal nexus
  - no favorable outcome establishes 8B effectiveness without ruler program and attribution
  - report volume and closed-system silence do not determine score direction
  - no blanket democracy or autocracy score correction is applied
  - prompt and provider token profiles exist for every LLM action, including failures
  - evidence breadth and source diversity do not materially regress from preserved baselines
  - any movement greater than one point enters the score/order audit
  - token or runtime growth above 1.5 times the AMLO accepted-path benchmark is investigated

evaluation_success:
  median_unchanged_evidence_rerun_drift_max: 0.5
  unexplained_score_movement_max: 1.0
  manual_complete_ruler_reads_minimum: 4
  required_manual_contrasts: [RUS, USA, COD, DEU]
  production_promotion: false
  comparison_manifest_fields:
    - local_evidence_records
    - web_evidence_records
    - evidence_mappings
    - source_family_diversity
    - score
    - confidence
    - plausible_range
    - null_status
    - manual_review_status
