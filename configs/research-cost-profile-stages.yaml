schema_version: research_cost_stage_rules_v1
event_filename: events.jsonl
rules:
  - artifact_type: corpus_reading_call
    stage: reading
    path_pattern: reading/*/events.jsonl
    selection_mode: all_completed
  - artifact_type: chapter_analysis_call
    stage: chapter-analysis
    path_pattern: chapter-analysis/*/**/events.jsonl
    selection_mode: selected_chapter_artifact
  - artifact_type: chapter_review_call
    stage: chapter-review
    path_pattern: chapter-quality*/**/events.jsonl
    selection_mode: selected_chapter_artifact
  - artifact_type: chapter_revision_call
    stage: chapter-repair
    path_pattern: chapter-repair-*/**/events.jsonl
    selection_mode: selected_chapter_artifact
  - artifact_type: chapter_remediation_call
    stage: chapter-repair
    path_pattern: chapter-remediation*/**/events.jsonl
    selection_mode: selected_chapter_artifact
  - artifact_type: chapter_compaction_call
    stage: chapter-compaction
    path_pattern: chapter-compaction/**/events.jsonl
    selection_mode: selected_chapter_artifact
  - artifact_type: chapter_coverage_review_call
    stage: chapter-review
    path_pattern: chapter-coverage-quality/**/events.jsonl
    selection_mode: selected_chapter_artifact
  - artifact_type: chapter_coverage_repair_call
    stage: chapter-repair
    path_pattern: chapter-coverage-repair/**/events.jsonl
    selection_mode: selected_chapter_artifact
  - artifact_type: chapter_revision_call_legacy
    stage: chapter-repair
    path_pattern: chapter-revisions/**/events.jsonl
    selection_mode: selected_chapter_artifact
  - artifact_type: chapter_revision_review_call
    stage: chapter-review
    path_pattern: chapter-revision-quality/**/events.jsonl
    selection_mode: selected_chapter_artifact
