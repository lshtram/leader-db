[project]
name = "simple-evidence-extractor"
version = "0.1.0"
description = "Clean-room, CLI-driven exact-citation evidence extractor"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
simple-evidence = "simple_evidence.main:main"
evidence = "simple_evidence.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
